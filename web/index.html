width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M10 12l5 3-5 3Z"/></symbol>
</svg>
<div class="app">
<header class="topbar"><div class="brand-wrap"><button class="mobile-menu" id="mobileMenu" aria-label="打开会话列表"><svg class="icon"><use href="#i-menu"/></svg></button><div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">声译</span><span class="brand-en">Live Interpret</span></div></div><div class="topbar-right"><div class="save-state"><svg class="icon small"><use href="#i-cloud"/></svg><span>已保存在本机</span></div><button class="quiet-btn" id="openSettings"><svg class="icon small"><use href="#i-settings"/></svg><span>设置</span></button></div></header>
<div class="workspace"><aside class="sidebar"><button class="new-session" id="newSession"><svg class="icon small"><use href="#i-plus"/></svg><span>新同传</span></button><div class="sidebar-label"><span>会话</span><span id="sessionTotal">00</span></div><div class="session-list" id="sessionList"></div><div class="sidebar-bottom"><button class="collapse-btn" id="collapseSidebar"><svg class="icon small"><use href="#i-collapse"/></svg><span>收起会话栏</span></button></div></aside>
<main class="main"><section class="session-header"><div class="eyebrow"><span class="status-dot" id="headerStatusDot"></span><span id="sessionKicker">当前会话</span><span>/</span><span id="directionKicker">英文 → 中文</span></div><div class="title-row"><input class="title-input" id="sessionTitle" maxlength="80" aria-label="会话名称"></div><div class="session-subrow"><div class="session-meta"><svg class="icon small"><use href="#i-mic"/></svg><span class="source-text" id="headerSource">系统音频</span><span>·</span><span id="headerStarted">尚未开始</span><span>·</span><span id="headerDuration">音频 00:00</span><span>·</span><span class="session-state" id="sessionState">待开始</span></div><button class="quiet-btn" id="openInfo"><svg class="icon small"><use href="#i-info"/></svg><span>会话信息</span></button></div></section>
<div class="timeline-toolbar"><div class="timeline-title">双语文本 <span class="sentence-count" id="sentenceCount">0 句</span></div><button class="follow-btn active" id="followToggle" aria-pressed="true"><span class="follow-indicator"></span><span id="followText">自动跟随当前句</span></button></div><div class="timeline-scroll" id="timelineScroll"><div class="timeline" id="timeline"></div></div>
<footer class="transport-wrap"><div class="transport"><div class="source-picker"><button class="source-button" id="sourceButton" aria-expanded="false"><svg class="icon small"><use href="#i-monitor"/></svg><span class="source-copy"><span class="source-name" id="sourceName">系统音频</span><span class="source-detail" id="sourceDetail">会议与视频声音</span></span><span class="source-chevron">⌃</span></button><div class="popover-menu source-menu" id="sourceMenu" hidden></div><input type="file" id="mediaFile" accept=".wav,.mp3,.m4a,.aac,.flac,.mp4,.mov,.m4v" aria-hidden="true" tabindex="-1" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div><button class="direction-btn" id="directionToggle" title="切换方向会重置当前语言上下文"><span class="direction-lang" id="sourceLang">EN</span><svg class="icon"><use href="#i-swap"/></svg><span class="direction-lang" id="targetLang">中文</span></button><div class="strategy-control" id="strategyControl"><button class="strategy-option" data-policy="low_latency">实时</button><button class="strategy-option active" data-policy="balanced">均衡</button><button class="strategy-option" data-policy="complete">保真</button></div><button class="play-btn" id="playToggle"><svg class="icon small"><use href="#i-play"/></svg><span>开始</span></button><button class="model-chip stopped" id="modelChip"><span class="status-dot"></span><span id="modelChipText">模型已停止</span></button><span class="duration" id="transportDuration">00:00</span></div><div class="transport-note">切换音源将开启独立会话 · 原声仅在开始同传后接管</div></footer></main></div></div>
<div class="nav-backdrop" id="navBackdrop"></div><div class="backdrop" id="panelBackdrop"></div><aside class="info-panel" id="infoPanel" aria-hidden="true"><div class="panel-header"><h2 id="panelTitle">会话信息</h2><button class="close-btn" id="closePanel"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="panel-scroll" id="panelContent"></div></aside>
<div class="modal-layer" id="deleteModal" hidden><div class="modal" role="dialog" aria-modal="true"><div class="modal-symbol"><svg class="icon"><use href="#i-trash"/></svg></div><h3>删除这个会话？</h3><p id="deleteDescription"></p><div class="modal-actions"><button class="cancel-btn" id="cancelDelete">取消</button><button class="danger-btn" id="confirmDelete">永久删除</button></div></div></div><div class="toast-region" id="toastRegion" aria-live="polite"></div>
<script>
(()=>{
"use strict";
const authToken=(()=>{try{const fragment=new URLSearchParams(location.hash.slice(1)),token=fragment.get("auth");if(token){sessionStorage.setItem("echonote.auth",token);history.replaceState(null,"",location.pathname+location.search)}return sessionStorage.getItem("echonote.auth")||""}catch{return""}})();
const $=id=>document.getElementById(id);
const $$=selector=>Array.from(document.querySelectorAll(selector));
const icon=(name,small=true)=>`<svg class="icon${small?" small":""}"><use href="#i-${name}"/></svg>`;
const escapeHTML=value=>String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const clampText=(value,fallback)=>String(value||fallback).trim()||fallback;
const policies={low_latency:{name:"实时",desc:"短分段、尽早播报；积极追平，积压过高时跳过旧语音",tradeoff:"延迟最低；语音可能明显变速或跳句，字幕始终完整。"},balanced:{name:"均衡",desc:"连续调度与温和调速；严重积压时才跳过旧语音",tradeoff:"默认选择；兼顾等待、连续性与内容完整性。"},complete:{name:"保真",desc:"固定 1.0 倍语速，不跳句；允许译文声音逐渐落后",tradeoff:"完整保留每句语音，不自动加速、减速或跳过。"}};
let baseConfig=null,sessions=[],activeId=null,sources=[],histories=new Map(),mediaNames=new Map(),ws=null,busy=false,panelOpen=false,panelMode="info",pendingDeleteId=null,autoFollow=localStorage.getItem("echonote.follow")!=="0",voicePolicy=localStorage.getItem("echonote.policy")||"balanced",playingSegmentId=null,debug=new URLSearchParams(location.search).get("debug")==="1",refreshTimer=null;
const active=()=>sessions.find(item=>item.session_id===activeId)||null;
const cues=()=>histories.get(activeId)||new Map();
const modelSession=()=>sessions.find(item=>["preparing","ready","running","paused"].includes(item.state))||null;
const direction=session=>session?.config?.translator?.direction||"en-zh";
const stateText=session=>({idle:session?.started_at_ms?"已结束":"待开始",preparing:"准备中",ready:session?.ended_at_ms?"已结束":"模型就绪",running:"进行中",paused:"已暂停",stopping:"正在停止",faulted:"需要处理",configuring:"配置中"}[session?.state]||"待开始");
function toast(message,error=false){if(!error)return;const node=document.createElement("div");node.className="toast error";node.innerHTML=`${icon("info")}<span>${escapeHTML(message)}</span>`;$("toastRegion").append(node);setTimeout(()=>node.remove(),5200)}
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function sourceInfo(config){if(!config)return{name:"系统音频",detail:"会议与视频声音",key:"system"};switch(config.type){case"macos_system":return{name:"系统音频",detail:"会议与视频声音",key:"system"};case"macos_microphone":return{name:"麦克风",detail:"系统默认输入设备",key:"microphone"};case"file":return{name:mediaNames.get(activeId)||"本地音视频",detail:"本地文件 · 实时解码",key:"media"};case"macos_process":{const pid=config.pids?.[0],item=sources.find(source=>source.pid===pid);return{name:item?.name||"应用音频",detail:item?.is_running?"正在播放":"应用进程",key:`process:${pid}`}}case"mock":return{name:"模拟音源",detail:"诊断链路",key:"mock"};default:return{name:"未知音源",detail:"",key:"unknown"}}}
function durationSeconds(session){return Math.max(0,Math.floor((session?.metrics?.captured_duration_us||0)/1e6))}
function formatDuration(seconds){const hours=Math.floor(seconds/3600),minutes=Math.floor(seconds/60)%60,rest=seconds%60;return hours?`${pad(hours)}:${pad(minutes)}:${pad(rest)}`:`${pad(minutes)}:${pad(rest)}`}
function formatDate(ms,withDay=false){if(!ms)return"尚未开始";const date=new Date(ms),today=new Date(),same=date.toDateString()===today.toDateString(),clock=`${pad(date.getHours())}:${pad(date.getMinutes())}`;return withDay&&!same?`${date.getMonth()+1}月${date.getDate()}日 ${clock}`:clock}
function timecode(ns){return formatDuration(Math.max(0,Math.floor(ns/1e9)))}
async function api(path,options={}){const headers={...(options.body&&!(options.body instanceof Blob)&&!(options.body instanceof ArrayBuffer)?{"content-type":"application/json"}:{}),...(authToken?{authorization:`Bearer ${authToken}`}:{}),...(options.headers||{})};const response=await fetch(path,{...options,headers});if(response.status===204)return null;const type=response.headers.get("content-type")||"",body=type.includes("json")?await response.json():await response.text();if(!response.ok)throw new Error(body?.message||body||response.statusText);return body}
function replaceSnapshot(snapshot){const index=sessions.findIndex(item=>item.session_id===snapshot.session_id);if(index>=0)sessions[index]=snapshot;else sessions.unshift(snapshot);sessions.sort((a,b)=>b.created_at_ms-a.created_at_ms);return snapshot}
async function refreshSessions(){const list=await api("/api/sessions");sessions=list.sort((a,b)=>b.created_at_ms-a.created_at_ms);renderAll()}
async function loadHistory(id){const list=await api(`/api/sessions/${id}/history`);histories.set(id,new Map(list.map(cue=>[cue.cue_id,cue])))}
function renderSidebar(){const total=sessions.length;$("sessionTotal").textContent=pad(total);$("sessionList").innerHTML=sessions.map(session=>{const count=histories.get(session.session_id)?.size||0,info=sourceInfoFor(session);return`<div class="session-row"><button class="session-item ${session.session_id===activeId?"active":""}" data-session="${session.session_id}" title="${escapeHTML(session.title)}"><span class="collapsed-mark">${escapeHTML((session.title||"回").slice(0,1))}</span><span class="session-item-top">${session.state==="running"?'<span class="live-dot"></span>':""}<span class="session-item-title">${escapeHTML(session.title)}</span></span><span class="session-item-meta"><span>${escapeHTML(formatDate(session.created_at_ms,true))}</span><span>·</span><span>${count} 句</span></span><span class="session-item-source">${escapeHTML(info.name)}</span></button><button class="session-delete" data-delete="${session.session_id}" title="删除会话">${icon("trash")}</button></div>`}).join("")}
function sourceInfoFor(session){const current=activeId;activeId=session.session_id;const info=sourceInfo(session.config.source);activeId=current;return info}
function renderMeta(){const session=active();if(!session)return;const info=sourceInfo(session.config.source),dir=direction(session),status=stateText(session);if(document.activeElement!==$("sessionTitle"))$("sessionTitle").value=session.title;$("headerSource").textContent=info.name+(info.detail?` · ${info.detail}`:"");$("headerStarted").textContent=session.started_at_ms?`${formatDate(session.started_at_ms,true)} 开始`:"尚未开始";$("sessionState").textContent=status;$("sessionState").classList.toggle("live",session.state==="running");$("headerStatusDot").classList.toggle("live",session.state==="running");$("sessionKicker").textContent=session.state==="running"?"正在同传":session.started_at_ms?"会话记录":"当前会话";$("directionKicker").textContent=dir==="en-zh"?"英文 → 中文":"中文 → 英文";$("sourceName").textContent=info.name;$("sourceDetail").textContent=info.detail;$("sourceLang").textContent=dir==="en-zh"?"EN":"中文";$("targetLang").textContent=dir==="en-zh"?"中文":"EN";updateDurations()}
function updateDurations(){const session=active(),value=formatDuration(durationSeconds(session));$("headerDuration").textContent=`音频 ${value}`;$("transportDuration").textContent=value;const panel=$("panelAudioDuration");if(panel)panel.textContent=value}
function isPlaying(cue){return Boolean(playingSegmentId&&cue.segment_ids?.includes(playingSegmentId))}
function renderTimeline(scroll=false){const session=active();if(!session)return;const all=[...cues().values()],dir=direction(session),scrollArea=$("timelineScroll"),previous=scrollArea.scrollTop;$("sentenceCount").textContent=`${all.length} 句 · ${dir==="en-zh"?"EN / 中文":"中文 / EN"}`;if(!all.length){$("timeline").innerHTML=`<div class="empty-timeline"><div><div class="empty-icon">${icon("wave",false)}</div><h3>${session.state==="running"?"正在聆听新的声音":"让声音跨越语言"}</h3><p>${session.state==="running"?"识别到的双语句会按时间顺序出现在这里。":"选择音源，点击“开始”，双语句将在这条时间线中展开。"}</p></div></div>`;return}$("timeline").innerHTML=`<div class="day-divider">${escapeHTML(formatDate(session.created_at_ms,true))} · 会话创建</div>`+all.map(cue=>{const activeCue=isPlaying(cue);return`<article class="segment ${activeCue?"active":""}" data-cue="${escapeHTML(cue.cue_id)}"><div class="segment-time">${timecode(cue.source_start_ns)}</div><div class="segment-content"><p class="source-line ${dir==="zh-en"?"zh":""}">${escapeHTML(cue.source_text||"…")}</p><p class="translation-line ${dir==="zh-en"?"en":""}">${escapeHTML(cue.translated_text||"…")}</p>${activeCue?`<div class="playing-label"><span class="equalizer"><i></i><i></i><i></i></span>正在播放</div>`:""}</div></article>`}).join("");if(scroll||autoFollow)requestAnimationFrame(()=>{const current=$("timeline").querySelector(".segment.active");if(current)current.scrollIntoView({behavior:"smooth",block:"nearest"});else scrollArea.scrollTop=scrollArea.scrollHeight});else scrollArea.scrollTop=previous}
function renderTransport(){const session=active(),model=modelSession(),state=session?.state||"idle",button=$("playToggle");button.disabled=busy||["preparing","stopping"].includes(state);button.innerHTML=state==="running"?`${icon("pause")}<span>暂停</span>`:`${icon("play")}<span>${state==="paused"?"继续":state==="preparing"?"准备中":"开始"}</span>`;$("modelChip").className="model-chip"+(model?"":" stopped")+(model?.state==="preparing"?" preparing":"");$("modelChipText").textContent=model?.state==="preparing"?"模型加载中":model?"模型运行中":"模型已停止";$$('[data-policy]').forEach(node=>{if(!node.classList.contains("policy-card")){node.classList.toggle("active",node.dataset.policy===voicePolicy);node.setAttribute("aria-pressed",String(node.dataset.policy===voicePolicy))}});$("directionToggle").disabled=busy||["preparing","stopping"].includes(state);$("newSession").disabled=busy}
function renderFollow(){$("followToggle").classList.toggle("active",autoFollow);$("followToggle").setAttribute("aria-pressed",String(autoFollow));$("followText").textContent=autoFollow?"自动跟随当前句":"跟随已关闭"}
function renderAll(scroll=false){renderSidebar();renderMeta();renderTimeline(scroll);renderTransport();renderFollow();if(panelOpen)renderPanel()}
function renderSourceMenu(){const session=active(),current=session?.config.source,info=sourceInfo(current);const item=(key,title,subtitle,iconName,value)=>`<button class="menu-item ${info.key===key?"selected":""}" data-source-choice="${key}" ${value?`data-value="${value}"`:""}>${icon(iconName)}<span class="menu-item-copy"><span class="menu-item-title">${escapeHTML(title)}</span><span class="menu-item-subtitle">${escapeHTML(subtitle)}</span></span><span class="menu-check">✓</span></button>`;const media=`<button class="menu-item ${info.key==="media"?"selected":""}" data-source-choice="media">${icon("file")}<span class="menu-item-copy"><span class="menu-item-title">本地音视频</span><span class="menu-item-subtitle">导入文件并实时同传</span></span><span class="menu-check">✓</span></button>`;let html='<div class="menu-heading">选择新音源将自动开启独立会话</div>'+item("system","系统音频","会议、浏览器与视频软件声音","monitor")+item("microphone","麦克风","系统默认输入设备","mic")+media;const apps=sources.filter(source=>source.kind==="process"&&!source.bundle_id?.includes(".helper"));if(apps.length){html+='<div class="menu-divider"></div><div class="menu-heading">应用音频 · 自动包含应用内声音</div>'+apps.map(source=>item(`process:${source.pid}`,`${source.is_running?"● ":""}${source.name}`,source.is_running?"正在播放":"应用进程","monitor",source.pid)).join("")}$("sourceMenu").innerHTML=html}
function renderPanel(){const session=active();if(!session)return;const model=modelSession(),count=cues().size;$("panelTitle").textContent=panelMode==="settings"?"设置":"会话信息";if(panelMode==="settings"){$("panelContent").innerHTML=`<section class="panel-section"><div class="section-heading"><h3>语音策略</h3><span>系统设置 · 对所有会话生效</span></div><div class="policy-list">${Object.entries(policies).map(([key,item])=>`<button class="policy-card ${voicePolicy===key?"selected":""}" data-policy="${key}"><span class="policy-radio"></span><span class="policy-name">${item.name}${key==="balanced"?'<span class="default-tag">默认</span>':""}</span><span class="policy-desc">${item.desc}</span></button>`).join("")}</div><div class="policy-tradeoff"><strong>${policies[voicePolicy].name}：</strong>${policies[voicePolicy].tradeoff}</div></section><section class="panel-section"><div class="section-heading"><h3>模型服务</h3><span>系统设置 · 独立运行</span></div><div class="model-card"><div><div class="model-name"><span class="status-dot ${model?"":"live"}"></span>双语同传模型</div><div class="model-desc">${model?.state==="preparing"?"正在加载模型权重":model?"已加载，可开始同传":"已停止，历史仍可查看与下载"}</div></div><button class="model-toggle" id="modelToggle" ${busy?"disabled":""}>${model?"停止模型":"启动模型"}</button></div><p class="model-note">模型服务全局唯一。切换方向会重置语言上下文；语音策略只改变后续播放，不重载模型。</p></section>${debug?`<section class="panel-section"><div class="section-heading"><h3>实时链路</h3><span>DEBUG</span></div><div class="debug-metrics"><span>采集 ${(session.metrics.captured_duration_us/1e6).toFixed(1)} s</span><span>模型积压 ${(session.metrics.model_backlog_us/1e6).toFixed(1)} s</span><span>播报 ${session.metrics.playback_started}/${session.metrics.playback_finished}</span><span>TTS 队列 ${session.metrics.tts_queue_depth}</span></div></section>`:""}`;return}$("panelContent").innerHTML=`<section class="panel-section"><div class="section-heading"><h3>会话概览</h3><span>${session.state==="running"?"LIVE":"ARCHIVED"}</span></div><div class="detail-grid"><div class="detail-item full"><div class="detail-label">会话名称</div><div class="detail-value">${escapeHTML(session.title)}</div></div><div class="detail-item full"><div class="detail-label">音源</div><div class="detail-value">${escapeHTML(sourceInfo(session.config.source).name)}</div></div><div class="detail-item"><div class="detail-label">开始时间</div><div class="detail-value">${escapeHTML(formatDate(session.started_at_ms,true))}</div></div><div class="detail-item"><div class="detail-label">音频时长</div><div class="detail-value" id="panelAudioDuration">${formatDuration(durationSeconds(session))}</div></div><div class="detail-item"><div class="detail-label">双语句数</div><div class="detail-value">${count} 句</div></div><div class="detail-item"><div class="detail-label">当前状态</div><div class="detail-value">${escapeHTML(stateText(session))}</div></div></div></section><section class="panel-section"><div class="section-heading"><h3>下载会话</h3><span>${count} 句可用</span></div><div class="export-grid"><button class="export-btn" data-export="srt">${icon("download")}<span>SRT 字幕</span></button><button class="export-btn" data-export="vtt">${icon("download")}<span>VTT 字幕</span></button><button class="export-btn" data-export="wav">${icon("download")}<span>译文音频</span></button></div><div class="export-note">字幕包含双语与原始时间轴；音频为连续译文配音。</div></section><section class="panel-section"><button class="clear-btn" id="deleteCurrent">删除整个会话</button><div class="clear-note">删除时间线、记录与关联音频 · 操作前需要确认</div></section>`}
function openPanel(mode){panelOpen=true;panelMode=mode;renderPanel();$("infoPanel").classList.add("open");$("infoPanel").setAttribute("aria-hidden","false");$("panelBackdrop").classList.add("visible")}
function closePanel(){panelOpen=false;$("infoPanel").classList.remove("open");$("infoPanel").setAttribute("aria-hidden","true");$("panelBackdrop").classList.remove("visible")}
async function run(work){if(busy)return;busy=true;renderTransport();try{await work()}catch(error){toast(error.message,true)}finally{busy=false;renderAll();if(panelOpen)renderPanel()}}
function connect(){if(ws)ws.close();if(!activeId)return;const protocol=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(`${protocol}://${location.host}/api/sessions/${activeId}/ws`);ws.onopen=()=>ws.send(JSON.stringify({type:"authenticate",token:authToken}));ws.onmessage=message=>{const event=JSON.parse(message.data),kind=event.kind;if(event.session_id!==activeId)return;switch(kind.type){case"state":{const session=active();if(session){session.state=kind.data.state;session.last_error=kind.data.message||session.last_error;renderAll()}break}case"subtitle":cues().set(kind.data.cue_id,kind.data);renderSidebar();renderTimeline();if(panelOpen)renderPanel();break;case"playback":if(kind.data.event_type==="started")playingSegmentId=kind.data.segment_id;else if(["finished","cancelled","failed","expired"].includes(kind.data.event_type)&&playingSegmentId===kind.data.segment_id)playingSegmentId=null;renderTimeline();break;case"metrics":if(active())active().metrics=kind.data;if(panelOpen&&debug)renderPanel();break;case"history_cleared":cues().clear();renderAll();break;case"warning":toast(kind.data.message);break;case"error":toast(kind.data.message,true);refreshSessions();break}};ws.onclose=()=>{if(activeId)setTimeout(()=>{if(!ws||ws.readyState===WebSocket.CLOSED)connect()},1200)}}
async function selectSession(id){if(id===activeId){document.body.classList.remove("mobile-nav-open");return}const running=sessions.find(item=>item.state==="running"&&item.session_id!==id);await run(async()=>{if(running)replaceSnapshot(await api(`/api/sessions/${running.session_id}/stop`,{method:"POST",body:"{}"}));activeId=id;localStorage.setItem("echonote.session",id);playingSegmentId=null;if(!histories.has(id))await loadHistory(id);connect();autoFollow=true;document.body.classList.remove("mobile-nav-open");renderAll(true)})}
function configForNew(source){const config=structuredClone(baseConfig),previous=active();config.latency_mode=voicePolicy;config.source=source||structuredClone(previous?.config.source||baseConfig.source);if(previous&&previous.config.translator.type==="hy_simulmt")config.translator.direction=direction(previous);config.output.voice=config.translator.direction==="en-zh"?"Tingting":"Ava (Enhanced)";return config}
async function createSession(source,title){await run(async()=>{let session=await api("/api/sessions",{method:"POST",body:JSON.stringify(configForNew(source))});const fallback=title||`未命名同传 · ${pad(sessions.length+1)}`;session=await api(`/api/sessions/${session.session_id}/title`,{method:"PUT",body:JSON.stringify({title:fallback})});replaceSnapshot(session);activeId=session.session_id;localStorage.setItem("echonote.session",activeId);histories.set(activeId,new Map());playingSegmentId=null;connect();closeMenus();renderAll(true)})}
function sourceConfig(choice,value){if(choice==="system")return{type:"macos_system",exclude_pids:[],mute_original:true};if(choice==="microphone")return{type:"macos_microphone"};if(choice.startsWith("process:"))return{type:"macos_process",pids:[Number(value)],mute_original:true};return structuredClone(baseConfig.source)}
async function chooseSource(choice,value){if(choice==="media"){closeMenus();const nativePicker=window.webkit?.messageHandlers?.selectMedia;if(nativePicker)nativePicker.postMessage({});else $("mediaFile").click();return}const session=active();if(sourceInfo(session.config.source).key===choice){closeMenus();return}await createSession(sourceConfig(choice,value))}
async function createMediaSession(imported){await createSession(imported.config,imported.name);mediaNames.set(activeId,imported.name);const saved=readJSON("echonote.media",{});saved[activeId]=imported.name;localStorage.setItem("echonote.media",JSON.stringify(saved));renderAll()}
window.simulmtNativeMediaImport=async imported=>{if(!imported||imported.error){toast(imported?.error||"媒体导入失败",true);return}await createMediaSession({config:{type:"file",path:imported.path,realtime:true},name:imported.name})};
async function importMedia(file){let imported=null;await run(async()=>{toast(`正在解码「${file.name}」…`);const response=await fetch(`/api/media?name=${encodeURIComponent(file.name)}`,{method:"POST",headers:{"content-type":"application/octet-stream",...(authToken?{authorization:`Bearer ${authToken}`}:{})},body:file});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.message||"媒体解码失败");imported={config:{type:"file",path:body.path,realtime:true},name:file.name}});if(!imported)return;await createMediaSession(imported)}
async function waitReady(id){const deadline=Date.now()+180000;while(Date.now()<deadline){const snapshot=await api(`/api/sessions/${id}`);replaceSnapshot(snapshot);renderAll();if(snapshot.state==="ready")return snapshot;if(snapshot.state==="faulted"||snapshot.state==="idle")throw new Error(snapshot.last_error||"模型未能启动");await new Promise(resolve=>setTimeout(resolve,500))}throw new Error("模型加载超时，请检查模型日志")}
async function togglePlayback(){const session=active();if(!session)return;await run(async()=>{if(session.state==="running"){replaceSnapshot(await api(`/api/sessions/${activeId}/pause`,{method:"POST",body:"{}"}));return}if(session.state==="paused"){replaceSnapshot(await api(`/api/sessions/${activeId}/resume`,{method:"POST",body:"{}"}));return}if(["idle","faulted"].includes(session.state)){replaceSnapshot(await api(`/api/sessions/${activeId}/prepare`,{method:"POST",body:"{}"}));await refreshSessions();await waitReady(activeId)}replaceSnapshot(await api(`/api/sessions/${activeId}/start`,{method:"POST",body:"{}"}));await refreshSessions();toast("同传已开始，原声已接管")})}
async function toggleModel(){const model=modelSession();await run(async()=>{if(model){for(const session of sessions.filter(item=>["preparing","ready","running","paused"].includes(item.state)))replaceSnapshot(await api(`/api/sessions/${session.session_id}/stop-model`,{method:"POST",body:"{}"}));toast("模型已停止，历史内容不受影响")}else{replaceSnapshot(await api(`/api/sessions/${activeId}/prepare`,{method:"POST",body:"{}"}));toast("正在加载模型，就绪后可直接开始");await refreshSessions()}})}
async function changeDirection(){const session=active(),next=direction(session)==="en-zh"?"zh-en":"en-zh";await run(async()=>{replaceSnapshot(await api(`/api/sessions/${activeId}/direction`,{method:"PUT",body:JSON.stringify({direction:next})}));toast(`已切换为${next==="en-zh"?"英文 → 中文":"中文 → 英文"}，语言上下文已重置`)})}
async function setPolicy(key){if(!policies[key]||key===voicePolicy)return;const previous=voicePolicy;voicePolicy=key;localStorage.setItem("echonote.policy",key);renderAll();await run(async()=>{try{await Promise.all(sessions.map(async session=>replaceSnapshot(await api(`/api/sessions/${session.session_id}/latency-mode`,{method:"PUT",body:JSON.stringify({latency_mode:key})}))))}catch(error){voicePolicy=previous;localStorage.setItem("echonote.policy",previous);throw error}toast(`${policies[key].name}：${policies[key].tradeoff}`)})}
async function download(format){const session=active();if(!cues().size){toast("当前会话还没有可下载的内容");return}const response=await fetch(`/api/sessions/${activeId}/export.${format}`,{headers:authToken?{authorization:`Bearer ${authToken}`}:{}});if(!response.ok){const body=await response.json().catch(()=>({}));toast(body.message||"导出失败",true);return}const blob=await response.blob(),url=URL.createObjectURL(blob),anchor=document.createElement("a");anchor.href=url;anchor.download=`${session.title.replace(/[\\/:*?"<>|]/g,"-")}.${format}`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`${format.toUpperCase()} 已下载`)}
function askDelete(id){const session=sessions.find(item=>item.session_id===id);if(!session)return;pendingDeleteId=id;$("deleteDescription").textContent=`「${session.title}」的双语时间线与关联音频将被永久删除，此操作无法撤销。`;$("deleteModal").hidden=false;$("cancelDelete").focus()}
async function deleteSession(){const id=pendingDeleteId;if(!id)return;$("deleteModal").hidden=true;pendingDeleteId=null;await run(async()=>{await api(`/api/sessions/${id}`,{method:"DELETE"});sessions=sessions.filter(item=>item.session_id!==id);histories.delete(id);delete mediaNames[id];if(activeId===id){activeId=sessions[0]?.session_id||null;closePanel();if(activeId){localStorage.setItem("echonote.session",activeId);await loadHistory(activeId);connect()}else localStorage.removeItem("echonote.session")}if(activeId){renderAll(true)}toast("会话已删除")});if(!sessions.length)await createSession()}
function closeMenus(){$("sourceMenu").hidden=true;$("sourceButton").setAttribute("aria-expanded","false")}
async function refreshSources(){try{sources=await api("/api/sources");if(!$("sourceMenu").hidden)renderSourceMenu();renderMeta();renderSidebar()}catch(error){if(!$("sourceMenu").hidden)toast(`无法检测音源：${error.message}`,true)}}
async function init(){mediaNames=new Map(Object.entries(readJSON("echonote.media",{})));autoFollow=localStorage.getItem("echonote.follow")!=="0";try{baseConfig=await api("/api/default-config");if(!policies[voicePolicy])voicePolicy="balanced";sessions=(await api("/api/sessions")).sort((a,b)=>b.created_at_ms-a.created_at_ms);if(!sessions.length){const created=await api("/api/sessions",{method:"POST",body:JSON.stringify(configForNew())});sessions=[created]}const saved=localStorage.getItem("echonote.session");activeId=sessions.some(item=>item.session_id===saved)?saved:(sessions.find(item=>item.state==="running")||sessions[0]).session_id;localStorage.setItem("echonote.session",activeId);await Promise.all(sessions.map(session=>loadHistory(session.session_id).catch(()=>histories.set(session.session_id,new Map()))));const session=active();if(session.config.latency_mode&&!localStorage.getItem("echonote.policy"))voicePolicy=session.config.latency_mode;connect();renderAll(true);await refreshSources();refreshTimer=setInterval(refreshSources,2000);setInterval(updateDurations,1000)}catch(error){toast(`初始化失败：${error.message}`,true)}}
$("newSession").onclick=()=>createSession();$("sessionList").onclick=event=>{const remove=event.target.closest("[data-delete]");if(remove){askDelete(remove.dataset.delete);return}const item=event.target.closest("[data-session]");if(item)selectSession(item.dataset.session)};$("collapseSidebar").onclick=()=>document.body.classList.toggle("sidebar-collapsed");$("mobileMenu").onclick=()=>document.body.classList.toggle("mobile-nav-open");$("navBackdrop").onclick=()=>document.body.classList.remove("mobile-nav-open");$("sourceButton").onclick=()=>{const opening=$("sourceMenu").hidden;closeMenus();if(opening){renderSourceMenu();$("sourceMenu").hidden=false;$("sourceButton").setAttribute("aria-expanded","true");refreshSources()}};$("sourceMenu").onclick=event=>{const button=event.target.closest("[data-source-choice]");if(button)chooseSource(button.dataset.sourceChoice,button.dataset.value)};$("mediaFile").onchange=event=>{const file=event.target.files[0];if(file)importMedia(file);event.target.value=""};$("playToggle").onclick=togglePlayback;$("directionToggle").onclick=changeDirection;$("strategyControl").onclick=event=>{const button=event.target.closest("[data-policy]");if(button)setPolicy(button.dataset.policy)};$("followToggle").onclick=()=>{autoFollow=!autoFollow;localStorage.setItem("echonote.follow",autoFollow?"1":"0");renderFollow();if(autoFollow)renderTimeline(true)};$("sessionTitle").onchange=async event=>{const title=event.target.value.trim();if(!title||title===active().title){event.target.value=active().title;return}await run(async()=>{replaceSnapshot(await api(`/api/sessions/${activeId}/title`,{method:"PUT",body:JSON.stringify({title})}));toast("会话名称已更新")})};$("sessionTitle").onkeydown=event=>{if(event.key==="Enter")event.target.blur()};$("openInfo").onclick=()=>openPanel("info");$("openSettings").onclick=()=>openPanel("settings");$("modelChip").onclick=()=>openPanel("settings");$("closePanel").onclick=closePanel;$("panelBackdrop").onclick=closePanel;$("panelContent").onclick=event=>{const policy=event.target.closest("[data-policy]");if(policy){setPolicy(policy.dataset.policy);return}if(event.target.closest("#modelToggle")){toggleModel();return}if(event.target.closest("#deleteCurrent"))askDelete(activeId);const exportButton=event.target.closest("[data-export]");if(exportButton)download(exportButton.dataset.export)};$("cancelDelete").onclick=()=>{$("deleteModal").hidden=true;pendingDeleteId=null};$("confirmDelete").onclick=deleteSession;document.addEventListener("click",event=>{if(!event.target.closest(".source-picker"))closeMenus()});document.addEventListener("keydown",event=>{if(event.ctrlKey&&event.shiftKey&&event.code==="KeyD"){event.preventDefault();debug=!debug;if(panelOpen)renderPanel()}if(event.key==="Escape"){if(!$("deleteModal").hidden){$("deleteModal").hidden=true;pendingDeleteId=null}else if(panelOpen)closePanel();else closeMenus()}});init();
})();
</script>
</body>
